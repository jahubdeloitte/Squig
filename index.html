<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1F3B">
<title>Squig — Focus Tasks</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1B1F3B;
    --ink-soft: #262B4D;
    --ink-softer: #323863;
    --paper: #F7F5F0;
    --ember: #FF8552;
    --ember-dim: #7a4736;
    --moss: #7FA68C;
    --signal: #FFD166;
    --mist: #A8AEC1;
    --radius: 18px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    overscroll-behavior:none;
    min-height:100vh;
    min-height:100dvh;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom:calc(74px + env(safe-area-inset-bottom));
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 20px 12px;
  }
  header.top .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  header.top .mark{
    width:26px;height:26px;border-radius:50%;
    background:conic-gradient(var(--ember) 0 65%, var(--ink-softer) 65% 100%);
    position:relative;
    flex-shrink:0;
  }
  header.top .mark::after{
    content:"";
    position:absolute; inset:6px;
    background:var(--paper); border-radius:50%;
  }
  header.top .brand-name{ font-size:19px; font-weight:700; letter-spacing:-0.01em; }
  header.top .date{ font-size:13px; color:var(--mist); }

  main{ flex:1; padding:4px 20px 20px; }
  .view{ display:none; animation:fadein .25s ease; }
  .view.active{ display:block; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ---- Tasks list ---- */
  .list-head{
    display:flex; align-items:center; gap:8px;
    margin-bottom:12px;
    padding-left:2px;
  }
  .list-head h2{ font-size:14px; margin:0; text-transform:uppercase; letter-spacing:.08em; color:var(--mist); font-weight:600; }
  .list-head .count{ font-size:12px; color:var(--mist); margin-left:auto; }
  .list-hint{ font-size:12.5px; color:var(--mist); margin:-4px 0 14px 2px; line-height:1.5; }

  .cards{ display:flex; flex-direction:column; gap:10px; }

  .card-wrap{ position:relative; border-radius:var(--radius); overflow:hidden; }
  .card-swipe-bg{
    position:absolute; inset:0; background:var(--moss); color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-weight:700; font-size:14px; opacity:0; pointer-events:none;
  }
  .card-swipe-bg svg{ width:20px; height:20px; }

  .card{
    position:relative;
    background:var(--ink-soft);
    border-radius:var(--radius);
    padding:14px 16px;
    border:1px solid transparent;
    touch-action:pan-y;
    will-change:transform;
  }
  .card-title{ font-size:15.5px; font-weight:500; line-height:1.35; }
  .card-meta{ display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .badge{
    font-size:11.5px; padding:3px 8px; border-radius:100px;
    background:var(--ink-softer); color:var(--mist);
  }
  .badge.due{ background:var(--ink-softer); color:var(--mist); }
  .badge.due.due-soon{ background:#3a3320; color:var(--signal); }
  .badge.due.due-overdue{ background:#40241f; color:#ff9d85; }

  .empty{
    color:var(--mist); font-size:13.5px;
    padding:16px 2px; line-height:1.5;
  }

  .fab{
    position:fixed;
    right:calc(20px + max(0px, (100vw - 480px)/2));
    bottom:calc(90px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%;
    background:var(--ember); color:var(--ink);
    border:none; font-size:28px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(255,133,82,.35);
    z-index:20;
  }
  .fab:active{ transform:scale(0.94); }

  /* ---- Nav ---- */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0;
    background:rgba(27,31,59,0.92);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--ink-softer);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    z-index:10;
  }
  nav.tabs .wrap{ max-width:480px; margin:0 auto; display:flex; width:100%; }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--mist);
    font-family:'Inter'; font-size:12px; font-weight:500;
    padding:12px 0 10px; display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  nav.tabs button svg{ width:22px; height:22px; }
  nav.tabs button.active{ color:var(--paper); }
  nav.tabs button.active svg{ stroke:var(--ember); }

  /* ---- Focus view ---- */
  .focus-wrap{ display:flex; flex-direction:column; align-items:center; padding-top:18px; }
  .ring-holder{ position:relative; width:250px; height:250px; margin:6px 0 22px; }
  .ring-holder svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--ink-softer); stroke-width:14; }
  .ring-progress{ fill:none; stroke:var(--ember); stroke-width:14; stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s ease; }
  .ring-progress.break{ stroke:var(--moss); }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
  }
  .ring-time{ font-size:42px; font-weight:600; letter-spacing:-0.02em; }
  .ring-label{ font-size:12.5px; color:var(--mist); text-transform:uppercase; letter-spacing:.08em; }

  .focus-task{
    font-size:16px; font-weight:500; text-align:center;
    max-width:280px; min-height:24px; margin-bottom:4px;
  }
  .focus-hint{ font-size:13px; color:var(--mist); text-align:center; max-width:280px; margin-bottom:22px; }
  .focus-hint button.link{
    background:none; border:none; color:var(--ember); font-weight:600;
    font-size:13px; padding:0; text-decoration:underline;
  }

  .chip-row{ display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; justify-content:center; }
  .chip{
    background:var(--ink-soft); color:var(--mist); border:1px solid var(--ink-softer);
    padding:7px 14px; border-radius:100px; font-size:13px; font-weight:500;
  }
  .chip.active{ background:var(--ember); color:var(--ink); border-color:var(--ember); }
  .chip:disabled{ opacity:.5; }

  .focus-controls{ display:flex; gap:12px; margin-bottom:26px; }
  .btn{
    font-family:'Inter'; font-weight:600; font-size:14.5px;
    padding:13px 26px; border-radius:100px; border:none;
  }
  .btn-primary{ background:var(--ember); color:var(--ink); }
  .btn-ghost{ background:var(--ink-soft); color:var(--paper); border:1px solid var(--ink-softer); }
  .btn:active{ transform:scale(0.96); }

  .session-count{ font-size:13px; color:var(--mist); }
  .session-count b{ color:var(--paper); }

  /* ---- Sheet / modal ---- */
  .scrim{
    position:fixed; inset:0; background:rgba(10,12,26,.55);
    display:none; align-items:flex-end; z-index:30;
  }
  .scrim.show{ display:flex; }
  .sheet{
    background:var(--ink-soft);
    width:100%; max-width:480px; margin:0 auto;
    border-radius:24px 24px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    animation:slideup .22s ease;
    max-height:88vh;
    overflow-y:auto;
  }
  @keyframes slideup{ from{ transform:translateY(30px); opacity:0;} to{ transform:none; opacity:1;} }
  .sheet h3{ margin:0 0 16px; font-size:17px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--mist); margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em; }
  .field input, .field textarea, .field select{
    width:100%; background:var(--ink); border:1px solid var(--ink-softer);
    color:var(--paper); border-radius:12px; padding:12px 14px;
    font-family:'Inter'; font-size:15px; resize:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:2px solid var(--ember); outline-offset:1px; }
  .field select{ appearance:none; -webkit-appearance:none; }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet-actions .btn{ flex:1; }
  .sheet-secondary-row{ display:flex; gap:10px; margin-top:10px; }
  .sheet-secondary-row .btn{ flex:1; padding:11px; font-size:13.5px; }
  .btn-danger{ background:transparent; color:#e08a7a; border:1px solid var(--ink-softer); }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:var(--paper); color:var(--ink); font-size:13.5px; font-weight:500;
    padding:10px 18px; border-radius:100px; z-index:40;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  ::selection{ background:var(--ember); color:var(--ink); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{ outline:2px solid var(--ember); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="brand">
      <div class="mark"></div>
      <div class="brand-name">Squig</div>
    </div>
    <div class="date" id="todayLabel"></div>
  </header>

  <main>

    <!-- TASKS -->
    <section class="view active" id="view-tasks">
      <div class="list-head"><h2>Tasks</h2><span class="count" id="taskCount">0</span></div>
      <div class="list-hint">Swipe a task either direction to mark it done. Tap it to edit, set a reminder, or start a focus session.</div>
      <div class="cards" id="cards-tasks"></div>
    </section>

    <!-- FOCUS -->
    <section class="view" id="view-focus">
      <div class="focus-wrap">

        <div class="ring-holder">
          <svg viewBox="0 0 240 240">
            <circle class="ring-track" cx="120" cy="120" r="105"></circle>
            <circle class="ring-progress" id="ringProgress" cx="120" cy="120" r="105"
              stroke-dasharray="659.7" stroke-dashoffset="0"></circle>
          </svg>
          <div class="ring-center">
            <div class="ring-time mono" id="ringTime">25:00</div>
            <div class="ring-label" id="ringLabel">Focus</div>
          </div>
        </div>

        <div class="focus-task" id="focusTaskName">No task selected</div>
        <div class="focus-hint" id="focusHint">
          Pick something from your tasks, or just start the timer —
          <button class="link" id="pickTaskBtn">choose a task</button>
        </div>

        <div class="chip-row" id="durationChips">
          <button class="chip active" data-min="25">25 min</button>
          <button class="chip" data-min="50">50 min</button>
          <button class="chip" data-min="10">10 min</button>
          <button class="chip" data-min="5" data-break="1">5 min break</button>
        </div>

        <div class="focus-controls">
          <button class="btn btn-primary" id="startPauseBtn">Start</button>
          <button class="btn btn-ghost" id="resetBtn">Reset</button>
        </div>

        <div class="session-count"><b id="sessionCount">0</b> focus sessions today</div>
      </div>
    </section>

  </main>

  <button class="fab" id="fabAdd" aria-label="Add task">+</button>

  <nav class="tabs">
    <div class="wrap">
      <button class="tab-btn active" data-view="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/>
          <path d="M4 6l1 1 2-2"/><path d="M4 12l1 1 2-2"/><path d="M4 18l1 1 2-2"/>
        </svg>
        Tasks
      </button>
      <button class="tab-btn" data-view="focus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.7l3 2" stroke-linecap="round"/></svg>
        Focus
      </button>
    </div>
  </nav>

  <!-- Add task sheet -->
  <div class="scrim" id="addScrim">
    <div class="sheet">
      <h3>New task</h3>
      <div class="field">
        <label for="taskTitle">What's the task?</label>
        <input id="taskTitle" type="text" placeholder="e.g. Reply to landlord email" maxlength="120">
      </div>
      <div class="field">
        <label for="taskEstimate">Time estimate (minutes, optional)</label>
        <input id="taskEstimate" type="number" inputmode="numeric" placeholder="15" min="1" max="480">
      </div>
      <div class="field">
        <label for="taskDue">Due &amp; remind me (optional)</label>
        <input id="taskDue" type="datetime-local">
      </div>
      <div class="field">
        <label for="taskRepeat">Repeat</label>
        <select id="taskRepeat">
          <option value="">Doesn't repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="cancelAdd">Cancel</button>
        <button class="btn btn-primary" id="saveAdd">Add task</button>
      </div>
    </div>
  </div>

  <!-- Task detail sheet -->
  <div class="scrim" id="detailScrim">
    <div class="sheet">
      <h3 id="detailTitle">Task</h3>
      <div id="detailMeta" class="focus-hint" style="text-align:left; margin-bottom:14px; max-width:none;"></div>
      <div class="field">
        <label for="detailDue">Due &amp; remind me</label>
        <input id="detailDue" type="datetime-local">
      </div>
      <div class="field">
        <label for="detailRepeat">Repeat</label>
        <select id="detailRepeat">
          <option value="">Doesn't repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>
      <div class="sheet-secondary-row" style="margin-top:0; margin-bottom:16px;">
        <button class="btn btn-ghost" id="saveDetailDue">Save</button>
        <button class="btn btn-ghost" id="clearDetailDue">Clear due date</button>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="completeTaskBtn">Mark complete</button>
        <button class="btn btn-ghost" id="startFocusFromDetail">Start focus session</button>
      </div>
      <div class="sheet-secondary-row">
        <button class="btn btn-danger" id="deleteTask" style="flex:none; width:100%;">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div>

<script>
(function(){
  "use strict";

  /* ---------- storage ---------- */
  const STORE_KEY = "squig.tasks.v2";
  const SESS_KEY = "squig.sessions.v1";

  function load(key, fallback){
    try{ const v = JSON.parse(localStorage.getItem(key)); return v || fallback; }
    catch(e){ return fallback; }
  }
  function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

  // One-time migration: carry over data from the old "Lanturn" name, and
  // from the earlier Board/Doing/Done task shape, so nobody loses tasks.
  (function migrateOldData(){
    if(localStorage.getItem(STORE_KEY) !== null) return; // already migrated

    const oldSessions = localStorage.getItem('lanturn.sessions.v1');
    if(oldSessions !== null && localStorage.getItem(SESS_KEY) === null){
      localStorage.setItem(SESS_KEY, oldSessions);
    }

    // Try both the v1 Squig task shape and the original Lanturn shape.
    const oldTasksRaw = localStorage.getItem('squig.tasks.v1') || localStorage.getItem('lanturn.tasks.v1');
    if(!oldTasksRaw) return;
    try{
      const oldTasks = JSON.parse(oldTasksRaw) || [];
      // Drop anything already marked done (no more Done list), strip the
      // retired column/startedAt fields.
      const migrated = oldTasks
        .filter(t => t.column !== 'done')
        .map(t => ({
          id: t.id, title: t.title, estimateMin: t.estimateMin || null,
          createdAt: t.createdAt || new Date().toISOString(),
          dueAt: t.dueAt || null, notified: !!t.notified, repeat: t.repeat || null
        }));
      save(STORE_KEY, migrated);
    }catch(e){ /* leave fresh */ }
  })();

  let tasks = load(STORE_KEY, []);
  let sessions = load(SESS_KEY, []); // {date:'YYYY-MM-DD'}

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
  }

  /* ---------- header date ---------- */
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined,{ weekday:'short', month:'short', day:'numeric' });

  /* ---------- tabs ---------- */
  const views = { tasks: document.getElementById('view-tasks'), focus: document.getElementById('view-focus') };
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      Object.values(views).forEach(v=>v.classList.remove('active'));
      views[btn.dataset.view].classList.add('active');
    });
  });

  function fmtMin(m){ return m + 'm'; }

  /* ---------- repeating tasks ---------- */
  function repeatLabel(r){
    return r === 'daily' ? 'Daily' : r === 'weekly' ? 'Weekly' : r === 'monthly' ? 'Monthly' : '';
  }

  function advanceDate(base, repeat){
    const d = new Date(base);
    if(repeat === 'daily') d.setDate(d.getDate() + 1);
    else if(repeat === 'weekly') d.setDate(d.getDate() + 7);
    else if(repeat === 'monthly') d.setMonth(d.getMonth() + 1);
    return d;
  }

  /* ---------- due dates ---------- */
  const DUE_SOON_MS = 60 * 60 * 1000; // badge turns amber inside 1 hour

  function fmtDue(iso){
    const d = new Date(iso);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
    const isTomorrow = d.toDateString() === tomorrow.toDateString();
    const time = d.toLocaleTimeString(undefined,{ hour:'numeric', minute:'2-digit' });
    if(sameDay) return 'Today ' + time;
    if(isTomorrow) return 'Tomorrow ' + time;
    return d.toLocaleDateString(undefined,{ month:'short', day:'numeric' }) + ' ' + time;
  }

  function dueState(iso){
    const diff = new Date(iso).getTime() - Date.now();
    if(diff <= 0) return 'due-overdue';
    if(diff <= DUE_SOON_MS) return 'due-soon';
    return '';
  }

  // datetime-local wants "YYYY-MM-DDTHH:mm" in local time, not UTC ISO
  function toDatetimeLocalValue(iso){
    const d = new Date(iso);
    const pad = n => n.toString().padStart(2,'0');
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate())
      + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /* ---------- sorting & render ---------- */
  function sortedTasks(){
    return tasks.slice().sort((a,b)=>{
      if(a.dueAt && b.dueAt) return new Date(a.dueAt) - new Date(b.dueAt);
      if(a.dueAt) return -1;
      if(b.dueAt) return 1;
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });
  }

  function render(){
    const list = sortedTasks();
    document.getElementById('taskCount').textContent = list.length;
    renderList(list);
    renderTaskPicker();
    save(STORE_KEY, tasks);
  }

  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  function renderList(list){
    const el = document.getElementById('cards-tasks');
    el.innerHTML = '';
    if(list.length === 0){
      const p = document.createElement('div');
      p.className = 'empty';
      p.textContent = 'Nothing here yet — tap + whenever you\'re ready.';
      el.appendChild(p);
      return;
    }
    list.forEach(t=>{
      const wrap = document.createElement('div');
      wrap.className = 'card-wrap';

      const bg = document.createElement('div');
      bg.className = 'card-swipe-bg';
      bg.innerHTML = CHECK_SVG + '<span>Done</span>';
      wrap.appendChild(bg);

      const card = document.createElement('div');
      card.className = 'card';

      const title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = t.title;
      card.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      if(t.estimateMin){
        const badge = document.createElement('span');
        badge.className = 'badge mono';
        badge.textContent = '~' + fmtMin(t.estimateMin);
        meta.appendChild(badge);
      }
      if(t.dueAt){
        const state = dueState(t.dueAt);
        const due = document.createElement('span');
        due.className = 'badge due mono' + (state ? ' ' + state : '');
        due.textContent = (state === 'due-overdue' ? 'was due ' : 'due ') + fmtDue(t.dueAt);
        meta.appendChild(due);
      }
      if(t.repeat){
        const rep = document.createElement('span');
        rep.className = 'badge mono';
        rep.textContent = '↻ ' + repeatLabel(t.repeat);
        meta.appendChild(rep);
      }
      card.appendChild(meta);
      wrap.appendChild(card);
      el.appendChild(wrap);

      attachSwipe(wrap, card, bg, t.id);
    });
  }

  /* ---------- swipe to complete ---------- */
  function attachSwipe(wrap, card, bg, id){
    const threshold = 88;
    let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, isHorizontal = false;

    function onDown(e){
      dragging = true; decided = false; isHorizontal = false; dx = 0;
      startX = e.clientX; startY = e.clientY;
      card.style.transition = 'none';
      try{ card.setPointerCapture(e.pointerId); }catch(err){}
    }
    function onMove(e){
      if(!dragging) return;
      const x = e.clientX, y = e.clientY;
      dx = x - startX;
      const dy = y - startY;
      if(!decided){
        if(Math.abs(dx) > 6 || Math.abs(dy) > 6){
          decided = true;
          isHorizontal = Math.abs(dx) > Math.abs(dy);
        }
      }
      if(isHorizontal){
        if(e.cancelable) e.preventDefault();
        card.style.transform = 'translateX(' + dx + 'px)';
        bg.style.opacity = Math.min(Math.abs(dx) / threshold, 1);
      }
    }
    function onUp(e){
      if(!dragging) return;
      dragging = false;
      if(isHorizontal && Math.abs(dx) > threshold){
        card.style.transition = 'transform .18s ease, opacity .18s ease';
        card.style.transform = 'translateX(' + (dx > 0 ? '110%' : '-110%') + ')';
        card.style.opacity = '0';
        setTimeout(()=> completeTask(id), 170);
      } else if(!isHorizontal && Math.abs(dx) < 6 && Math.abs(e.clientY - startY) < 6){
        card.style.transition = 'transform .2s ease';
        card.style.transform = 'translateX(0)';
        bg.style.opacity = 0;
        openDetail(id);
      } else {
        card.style.transition = 'transform .2s ease';
        card.style.transform = 'translateX(0)';
        bg.style.opacity = 0;
      }
      dx = 0;
    }

    card.addEventListener('pointerdown', onDown);
    card.addEventListener('pointermove', onMove);
    card.addEventListener('pointerup', onUp);
    card.addEventListener('pointercancel', onUp);
  }

  /* ---------- complete / delete ---------- */
  function completeTask(id){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    let msg = 'Nice — marked done';
    if(t.repeat){
      const base = t.dueAt ? new Date(t.dueAt) : new Date();
      const nextDue = advanceDate(base, t.repeat);
      tasks.push({
        id: uid(), title: t.title, estimateMin: t.estimateMin,
        createdAt: new Date().toISOString(), dueAt: nextDue.toISOString(),
        notified: false, repeat: t.repeat
      });
      msg = 'Done · next one queued for ' + fmtDue(nextDue.toISOString());
    }
    tasks = tasks.filter(x=> x.id !== id);
    if(selectedTaskId === id){ selectedTaskId = null; updateFocusTaskLabel(); }
    detailScrim.classList.remove('show');
    render();
    toast(msg);
  }

  /* ---------- add task ---------- */
  const addScrim = document.getElementById('addScrim');
  document.getElementById('fabAdd').addEventListener('click', ()=>{
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskEstimate').value = '';
    document.getElementById('taskDue').value = '';
    document.getElementById('taskRepeat').value = '';
    addScrim.classList.add('show');
    setTimeout(()=> document.getElementById('taskTitle').focus(), 150);
  });
  document.getElementById('cancelAdd').addEventListener('click', ()=> addScrim.classList.remove('show'));
  addScrim.addEventListener('click', (e)=>{ if(e.target === addScrim) addScrim.classList.remove('show'); });

  document.getElementById('saveAdd').addEventListener('click', ()=>{
    const title = document.getElementById('taskTitle').value.trim();
    if(!title){ toast('Give it a name first'); return; }
    const est = parseInt(document.getElementById('taskEstimate').value, 10);
    const dueVal = document.getElementById('taskDue').value;
    const dueAt = dueVal ? new Date(dueVal).toISOString() : null;
    const repeat = document.getElementById('taskRepeat').value || null;
    tasks.push({
      id: uid(),
      title,
      estimateMin: (est && est > 0) ? est : null,
      createdAt: new Date().toISOString(),
      dueAt,
      notified: false,
      repeat
    });
    addScrim.classList.remove('show');
    render();
    toast('Added');
    if(dueAt) ensureNotificationPermission();
  });

  /* ---------- task detail ---------- */
  const detailScrim = document.getElementById('detailScrim');
  let activeTaskId = null;

  function openDetail(id){
    activeTaskId = id;
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    document.getElementById('detailTitle').textContent = t.title;
    document.getElementById('detailMeta').textContent = t.estimateMin
      ? ('Estimated ' + t.estimateMin + ' min')
      : 'No time estimate';
    document.getElementById('detailDue').value = t.dueAt ? toDatetimeLocalValue(t.dueAt) : '';
    document.getElementById('detailRepeat').value = t.repeat || '';
    detailScrim.classList.add('show');
  }

  document.getElementById('saveDetailDue').addEventListener('click', ()=>{
    const t = tasks.find(x=>x.id===activeTaskId);
    if(!t) return;
    const val = document.getElementById('detailDue').value;
    const repeat = document.getElementById('detailRepeat').value || null;
    if(!val && repeat){ toast('Add a due date so repeats have a time to anchor to'); return; }
    if(!val){ toast('Pick a date and time first'); return; }
    t.dueAt = new Date(val).toISOString();
    t.notified = false;
    t.repeat = repeat;
    render();
    ensureNotificationPermission();
    toast(repeat ? 'Saved · repeats ' + repeatLabel(repeat).toLowerCase() : 'Reminder set');
  });

  document.getElementById('clearDetailDue').addEventListener('click', ()=>{
    const t = tasks.find(x=>x.id===activeTaskId);
    if(!t) return;
    t.dueAt = null;
    t.notified = false;
    t.repeat = null;
    document.getElementById('detailDue').value = '';
    document.getElementById('detailRepeat').value = '';
    render();
    toast('Reminder cleared');
  });

  document.getElementById('completeTaskBtn').addEventListener('click', ()=>{
    completeTask(activeTaskId);
  });

  document.getElementById('deleteTask').addEventListener('click', ()=>{
    tasks = tasks.filter(t=> t.id !== activeTaskId);
    if(selectedTaskId === activeTaskId){ selectedTaskId = null; updateFocusTaskLabel(); }
    detailScrim.classList.remove('show');
    render();
    toast('Task deleted');
  });

  document.getElementById('startFocusFromDetail').addEventListener('click', ()=>{
    selectedTaskId = activeTaskId;
    detailScrim.classList.remove('show');
    document.querySelector('.tab-btn[data-view="focus"]').click();
    updateFocusTaskLabel();
  });

  detailScrim.addEventListener('click', (e)=>{ if(e.target === detailScrim) detailScrim.classList.remove('show'); });

  /* ---------- focus timer ---------- */
  let selectedTaskId = null;
  let durationMin = 25;
  let isBreak = false;
  let remainingSec = durationMin * 60;
  let timerId = null;
  let running = false;

  const RING_CIRC = 2 * Math.PI * 105;
  document.getElementById('ringProgress').setAttribute('stroke-dasharray', RING_CIRC.toFixed(1));

  function updateFocusTaskLabel(){
    const nameEl = document.getElementById('focusTaskName');
    const hintEl = document.getElementById('focusHint');
    if(selectedTaskId){
      const t = tasks.find(x=>x.id===selectedTaskId);
      if(t){
        nameEl.textContent = t.title;
        hintEl.innerHTML = 'Working on this one. <button class="link" id="pickTaskBtn2">Change task</button>';
        document.getElementById('pickTaskBtn2').addEventListener('click', ()=>{
          document.querySelector('.tab-btn[data-view="tasks"]').click();
        });
        return;
      }
    }
    nameEl.textContent = 'No task selected';
    hintEl.innerHTML = 'Pick something from your tasks, or just start the timer — <button class="link" id="pickTaskBtn">choose a task</button>';
    document.getElementById('pickTaskBtn').addEventListener('click', ()=>{
      document.querySelector('.tab-btn[data-view="tasks"]').click();
    });
  }
  updateFocusTaskLabel();

  function fmtTime(sec){
    const m = Math.floor(sec/60).toString().padStart(2,'0');
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return m + ':' + s;
  }

  function renderRing(){
    const total = durationMin * 60;
    const frac = total > 0 ? remainingSec / total : 0;
    const offset = RING_CIRC * (1 - frac);
    const ring = document.getElementById('ringProgress');
    ring.style.strokeDashoffset = offset.toFixed(1);
    ring.classList.toggle('break', isBreak);
    document.getElementById('ringTime').textContent = fmtTime(remainingSec);
    document.getElementById('ringLabel').textContent = isBreak ? 'Break' : 'Focus';
  }
  renderRing();

  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      if(running) return;
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      durationMin = parseInt(chip.dataset.min, 10);
      isBreak = chip.dataset.break === '1';
      remainingSec = durationMin * 60;
      renderRing();
    });
  });

  function tick(){
    remainingSec--;
    if(remainingSec <= 0){
      clearInterval(timerId);
      running = false;
      remainingSec = 0;
      renderRing();
      onSessionComplete();
      return;
    }
    renderRing();
  }

  function onSessionComplete(){
    document.getElementById('startPauseBtn').textContent = 'Start';
    if(!isBreak){
      sessions.push({ date: todayStr() });
      save(SESS_KEY, sessions);
      updateSessionCount();
      toast('Session done. Nicely paced.');
    } else {
      toast('Break\'s over, whenever you\'re ready.');
    }
    if('vibrate' in navigator){ navigator.vibrate([80,60,80]); }
  }

  document.getElementById('startPauseBtn').addEventListener('click', function(){
    if(running){
      running = false;
      clearInterval(timerId);
      this.textContent = 'Start';
    } else {
      running = true;
      this.textContent = 'Pause';
      timerId = setInterval(tick, 1000);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    running = false;
    clearInterval(timerId);
    remainingSec = durationMin * 60;
    document.getElementById('startPauseBtn').textContent = 'Start';
    renderRing();
  });

  function updateSessionCount(){
    const count = sessions.filter(s=> s.date === todayStr()).length;
    document.getElementById('sessionCount').textContent = count;
  }
  updateSessionCount();

  /* ---------- reminders ---------- */
  // Best-effort local reminders. These fire while Squig is open (foreground
  // or backgrounded tab) via the Notification API. True background delivery
  // when the app is fully closed needs server-sent Push, which isn't
  // available for a plain static/local-storage app like this one.
  function ensureNotificationPermission(){
    if(!('Notification' in window)) return;
    if(Notification.permission === 'default'){
      Notification.requestPermission();
    }
  }

  function fireReminder(t){
    const body = t.estimateMin ? ('~' + t.estimateMin + ' min · was due ' + fmtDue(t.dueAt)) : ('was due ' + fmtDue(t.dueAt));
    if('Notification' in window && Notification.permission === 'granted'){
      if(navigator.serviceWorker && navigator.serviceWorker.controller){
        navigator.serviceWorker.ready.then(reg=>{
          reg.showNotification('Squig: ' + t.title, { body, icon:'icons/icon-192.png', tag:t.id });
        }).catch(()=>{ new Notification('Squig: ' + t.title, { body }); });
      } else {
        new Notification('Squig: ' + t.title, { body });
      }
    } else {
      toast('Reminder: ' + t.title);
    }
    if('vibrate' in navigator){ navigator.vibrate([80,60,80]); }
  }

  function checkReminders(){
    let changed = false;
    tasks.forEach(t=>{
      if(t.dueAt && !t.notified && new Date(t.dueAt).getTime() <= Date.now()){
        fireReminder(t);
        t.notified = true;
        changed = true;
      }
    });
    if(changed){ save(STORE_KEY, tasks); render(); }
  }
  setInterval(checkReminders, 20000);
  checkReminders();

  /* ---------- task picker fallback ---------- */
  function renderTaskPicker(){
    if(selectedTaskId && !tasks.find(t=>t.id===selectedTaskId)){
      selectedTaskId = null;
      updateFocusTaskLabel();
    }
  }

  /* ---------- service worker ---------- */
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  render();
})();
</script>
</body>
