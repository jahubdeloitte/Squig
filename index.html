<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1F3B">
<title>Lanturn — Focus Tasks</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1B1F3B;
    --ink-soft: #262B4D;
    --ink-softer: #323863;
    --paper: #F7F5F0;
    --ember: #FF8552;
    --ember-dim: #7a4736;
    --moss: #7FA68C;
    --signal: #FFD166;
    --mist: #A8AEC1;
    --radius: 18px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    overscroll-behavior:none;
    min-height:100vh;
    min-height:100dvh;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom:calc(74px + env(safe-area-inset-bottom));
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 20px 12px;
  }
  header.top .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  header.top .mark{
    width:26px;height:26px;border-radius:50%;
    background:conic-gradient(var(--ember) 0 65%, var(--ink-softer) 65% 100%);
    position:relative;
    flex-shrink:0;
  }
  header.top .mark::after{
    content:"";
    position:absolute; inset:6px;
    background:var(--paper); border-radius:50%;
  }
  header.top .brand-name{ font-size:19px; font-weight:700; letter-spacing:-0.01em; }
  header.top .date{ font-size:13px; color:var(--mist); }

  main{ flex:1; padding:4px 20px 20px; }
  .view{ display:none; animation:fadein .25s ease; }
  .view.active{ display:block; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* ---- Board ---- */
  .column{ margin-bottom:22px; }
  .column-head{
    display:flex; align-items:center; gap:8px;
    margin-bottom:10px;
    padding-left:2px;
  }
  .column-head .dot{ width:8px; height:8px; border-radius:50%; }
  .column-head h2{ font-size:14px; margin:0; text-transform:uppercase; letter-spacing:.08em; color:var(--mist); font-weight:600; }
  .column-head .count{ font-size:12px; color:var(--mist); margin-left:auto; }

  .col-todo .dot{ background:var(--mist); }
  .col-doing .dot{ background:var(--ember); }
  .col-done .dot{ background:var(--moss); }

  .cards{ display:flex; flex-direction:column; gap:10px; }
  .card{
    background:var(--ink-soft);
    border-radius:var(--radius);
    padding:14px 16px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .card:active{ transform:scale(0.98); }
  .card.doing{ border-color:var(--ember-dim); }
  .card-title{ font-size:15.5px; font-weight:500; line-height:1.35; }
  .card-title.done{ text-decoration:line-through; color:var(--mist); }
  .card-meta{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .badge{
    font-size:11.5px; padding:3px 8px; border-radius:100px;
    background:var(--ink-softer); color:var(--mist);
  }
  .badge.over{ background:#3a3320; color:var(--signal); }

  .empty{
    color:var(--mist); font-size:13.5px;
    padding:16px 2px; line-height:1.5;
  }

  .fab{
    position:fixed;
    right:calc(20px + max(0px, (100vw - 480px)/2));
    bottom:calc(90px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%;
    background:var(--ember); color:var(--ink);
    border:none; font-size:28px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(255,133,82,.35);
    z-index:20;
  }
  .fab:active{ transform:scale(0.94); }

  /* ---- Nav ---- */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0;
    background:rgba(27,31,59,0.92);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--ink-softer);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    z-index:10;
  }
  nav.tabs .wrap{ max-width:480px; margin:0 auto; display:flex; width:100%; }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--mist);
    font-family:'Inter'; font-size:12px; font-weight:500;
    padding:12px 0 10px; display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  nav.tabs button svg{ width:22px; height:22px; }
  nav.tabs button.active{ color:var(--paper); }
  nav.tabs button.active svg{ stroke:var(--ember); }

  /* ---- Focus view ---- */
  .focus-wrap{ display:flex; flex-direction:column; align-items:center; padding-top:18px; }
  .ring-holder{ position:relative; width:250px; height:250px; margin:6px 0 22px; }
  .ring-holder svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--ink-softer); stroke-width:14; }
  .ring-progress{ fill:none; stroke:var(--ember); stroke-width:14; stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s ease; }
  .ring-progress.break{ stroke:var(--moss); }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
  }
  .ring-time{ font-size:42px; font-weight:600; letter-spacing:-0.02em; }
  .ring-label{ font-size:12.5px; color:var(--mist); text-transform:uppercase; letter-spacing:.08em; }

  .focus-task{
    font-size:16px; font-weight:500; text-align:center;
    max-width:280px; min-height:24px; margin-bottom:4px;
  }
  .focus-hint{ font-size:13px; color:var(--mist); text-align:center; max-width:280px; margin-bottom:22px; }
  .focus-hint button.link{
    background:none; border:none; color:var(--ember); font-weight:600;
    font-size:13px; padding:0; text-decoration:underline;
  }

  .chip-row{ display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; justify-content:center; }
  .chip{
    background:var(--ink-soft); color:var(--mist); border:1px solid var(--ink-softer);
    padding:7px 14px; border-radius:100px; font-size:13px; font-weight:500;
  }
  .chip.active{ background:var(--ember); color:var(--ink); border-color:var(--ember); }
  .chip:disabled{ opacity:.5; }

  .focus-controls{ display:flex; gap:12px; margin-bottom:26px; }
  .btn{
    font-family:'Inter'; font-weight:600; font-size:14.5px;
    padding:13px 26px; border-radius:100px; border:none;
  }
  .btn-primary{ background:var(--ember); color:var(--ink); }
  .btn-ghost{ background:var(--ink-soft); color:var(--paper); border:1px solid var(--ink-softer); }
  .btn:active{ transform:scale(0.96); }

  .session-count{ font-size:13px; color:var(--mist); }
  .session-count b{ color:var(--paper); }

  /* ---- Sheet / modal ---- */
  .scrim{
    position:fixed; inset:0; background:rgba(10,12,26,.55);
    display:none; align-items:flex-end; z-index:30;
  }
  .scrim.show{ display:flex; }
  .sheet{
    background:var(--ink-soft);
    width:100%; max-width:480px; margin:0 auto;
    border-radius:24px 24px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    animation:slideup .22s ease;
  }
  @keyframes slideup{ from{ transform:translateY(30px); opacity:0;} to{ transform:none; opacity:1;} }
  .sheet h3{ margin:0 0 16px; font-size:17px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--mist); margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em; }
  .field input, .field textarea{
    width:100%; background:var(--ink); border:1px solid var(--ink-softer);
    color:var(--paper); border-radius:12px; padding:12px 14px;
    font-family:'Inter'; font-size:15px; resize:none;
  }
  .field input:focus, .field textarea:focus{ outline:2px solid var(--ember); outline-offset:1px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet-actions .btn{ flex:1; }
  .sheet-secondary-row{ display:flex; gap:10px; margin-top:10px; }
  .sheet-secondary-row .btn{ flex:1; padding:11px; font-size:13.5px; }
  .btn-danger{ background:transparent; color:#e08a7a; border:1px solid var(--ink-softer); }

  .nudge{
    background:var(--ink-softer); border-radius:14px; padding:12px 14px;
    font-size:13px; color:var(--mist); margin-top:4px; margin-bottom:10px;
    line-height:1.5; display:none;
  }
  .nudge.show{ display:block; }
  .nudge b{ color:var(--paper); }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:var(--paper); color:var(--ink); font-size:13.5px; font-weight:500;
    padding:10px 18px; border-radius:100px; z-index:40;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  ::selection{ background:var(--ember); color:var(--ink); }
  button:focus-visible, input:focus-visible, textarea:focus-visible{ outline:2px solid var(--ember); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="brand">
      <div class="mark"></div>
      <div class="brand-name">Lanturn</div>
    </div>
    <div class="date" id="todayLabel"></div>
  </header>

  <main>

    <!-- BOARD -->
    <section class="view active" id="view-board">

      <div class="column col-todo">
        <div class="column-head"><span class="dot"></span><h2>To start</h2><span class="count" id="count-todo">0</span></div>
        <div class="cards" id="cards-todo"></div>
      </div>

      <div class="column col-doing">
        <div class="column-head"><span class="dot"></span><h2>Doing</h2><span class="count" id="count-doing">0</span></div>
        <div class="cards" id="cards-doing"></div>
      </div>

      <div class="column col-done">
        <div class="column-head"><span class="dot"></span><h2>Done</h2><span class="count" id="count-done">0</span></div>
        <div class="cards" id="cards-done"></div>
      </div>

    </section>

    <!-- FOCUS -->
    <section class="view" id="view-focus">
      <div class="focus-wrap">

        <div class="ring-holder">
          <svg viewBox="0 0 240 240">
            <circle class="ring-track" cx="120" cy="120" r="105"></circle>
            <circle class="ring-progress" id="ringProgress" cx="120" cy="120" r="105"
              stroke-dasharray="659.7" stroke-dashoffset="0"></circle>
          </svg>
          <div class="ring-center">
            <div class="ring-time mono" id="ringTime">25:00</div>
            <div class="ring-label" id="ringLabel">Focus</div>
          </div>
        </div>

        <div class="focus-task" id="focusTaskName">No task selected</div>
        <div class="focus-hint" id="focusHint">
          Pick something from your board, or just start the timer —
          <button class="link" id="pickTaskBtn">choose a task</button>
        </div>

        <div class="chip-row" id="durationChips">
          <button class="chip active" data-min="25">25 min</button>
          <button class="chip" data-min="50">50 min</button>
          <button class="chip" data-min="10">10 min</button>
          <button class="chip" data-min="5" data-break="1">5 min break</button>
        </div>

        <div class="focus-controls">
          <button class="btn btn-primary" id="startPauseBtn">Start</button>
          <button class="btn btn-ghost" id="resetBtn">Reset</button>
        </div>

        <div class="session-count"><b id="sessionCount">0</b> focus sessions today</div>
      </div>
    </section>

  </main>

  <button class="fab" id="fabAdd" aria-label="Add task">+</button>

  <nav class="tabs">
    <div class="wrap">
      <button class="tab-btn active" data-view="board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="6" height="16" rx="1.5"/><rect x="9.5" y="4" width="6" height="10" rx="1.5"/><rect x="16" y="4" width="5" height="7" rx="1.5"/></svg>
        Board
      </button>
      <button class="tab-btn" data-view="focus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.7l3 2" stroke-linecap="round"/></svg>
        Focus
      </button>
    </div>
  </nav>

  <!-- Add task sheet -->
  <div class="scrim" id="addScrim">
    <div class="sheet">
      <h3>New task</h3>
      <div class="field">
        <label for="taskTitle">What's the task?</label>
        <input id="taskTitle" type="text" placeholder="e.g. Reply to landlord email" maxlength="120">
      </div>
      <div class="field">
        <label for="taskEstimate">Time estimate (minutes)</label>
        <input id="taskEstimate" type="number" inputmode="numeric" placeholder="15" min="1" max="480">
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="cancelAdd">Cancel</button>
        <button class="btn btn-primary" id="saveAdd">Add task</button>
      </div>
    </div>
  </div>

  <!-- Task detail sheet -->
  <div class="scrim" id="detailScrim">
    <div class="sheet">
      <h3 id="detailTitle">Task</h3>
      <div id="detailMeta" class="focus-hint" style="text-align:left; margin-bottom:14px; max-width:none;"></div>
      <div class="nudge" id="doingNudge"></div>
      <div class="sheet-actions" id="moveActions"></div>
      <div class="sheet-secondary-row">
        <button class="btn btn-ghost" id="startFocusFromDetail">Start focus session</button>
        <button class="btn btn-danger" id="deleteTask">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div>

<script>
(function(){
  "use strict";

  /* ---------- storage ---------- */
  const STORE_KEY = "lanturn.tasks.v1";
  const SESS_KEY = "lanturn.sessions.v1";

  function load(key, fallback){
    try{ const v = JSON.parse(localStorage.getItem(key)); return v || fallback; }
    catch(e){ return fallback; }
  }
  function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

  let tasks = load(STORE_KEY, []);
  let sessions = load(SESS_KEY, []); // {date:'YYYY-MM-DD', focusCompleted:bool}

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
  }

  /* ---------- header date ---------- */
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined,{ weekday:'short', month:'short', day:'numeric' });

  /* ---------- tabs ---------- */
  const views = { board: document.getElementById('view-board'), focus: document.getElementById('view-focus') };
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      Object.values(views).forEach(v=>v.classList.remove('active'));
      views[btn.dataset.view].classList.add('active');
    });
  });

  /* ---------- render board ---------- */
  function fmtMin(m){ return m + 'm'; }

  function minutesSince(iso){
    return Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  }

  function render(){
    const cols = { todo:[], doing:[], done:[] };
    tasks.forEach(t=> cols[t.column].push(t));

    document.getElementById('count-todo').textContent = cols.todo.length;
    document.getElementById('count-doing').textContent = cols.doing.length;
    document.getElementById('count-done').textContent = cols.done.length;

    renderColumn('cards-todo', cols.todo, 'Nothing waiting — add something whenever you\'re ready.');
    renderColumn('cards-doing', cols.doing, 'Nothing in progress. Move a task here when you start it.');
    renderColumn('cards-done', cols.done, 'Finished tasks land here.');

    renderTaskPicker();
    save(STORE_KEY, tasks);
  }

  function renderColumn(elId, list, emptyText){
    const el = document.getElementById(elId);
    el.innerHTML = '';
    if(list.length === 0){
      const p = document.createElement('div');
      p.className = 'empty';
      p.textContent = emptyText;
      el.appendChild(p);
      return;
    }
    list.slice().reverse().forEach(t=>{
      const card = document.createElement('div');
      card.className = 'card' + (t.column==='doing' ? ' doing' : '');
      card.addEventListener('click', ()=> openDetail(t.id));

      const title = document.createElement('div');
      title.className = 'card-title' + (t.column==='done' ? ' done' : '');
      title.textContent = t.title;
      card.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      if(t.estimateMin){
        const badge = document.createElement('span');
        badge.className = 'badge mono';
        badge.textContent = '~' + fmtMin(t.estimateMin);
        meta.appendChild(badge);

        if(t.column === 'doing' && t.startedAt){
          const elapsed = minutesSince(t.startedAt);
          if(elapsed > t.estimateMin){
            const over = document.createElement('span');
            over.className = 'badge over mono';
            over.textContent = '+' + (elapsed - t.estimateMin) + 'm over';
            meta.appendChild(over);
          }
        }
      }
      card.appendChild(meta);
      el.appendChild(card);
    });
  }

  /* ---------- add task ---------- */
  const addScrim = document.getElementById('addScrim');
  document.getElementById('fabAdd').addEventListener('click', ()=>{
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskEstimate').value = '';
    addScrim.classList.add('show');
    setTimeout(()=> document.getElementById('taskTitle').focus(), 150);
  });
  document.getElementById('cancelAdd').addEventListener('click', ()=> addScrim.classList.remove('show'));
  addScrim.addEventListener('click', (e)=>{ if(e.target === addScrim) addScrim.classList.remove('show'); });

  document.getElementById('saveAdd').addEventListener('click', ()=>{
    const title = document.getElementById('taskTitle').value.trim();
    if(!title){ toast('Give it a name first'); return; }
    const est = parseInt(document.getElementById('taskEstimate').value, 10);
    tasks.push({
      id: uid(),
      title,
      estimateMin: (est && est > 0) ? est : null,
      column: 'todo',
      createdAt: new Date().toISOString(),
      startedAt: null
    });
    addScrim.classList.remove('show');
    render();
    toast('Added to To start');
  });

  /* ---------- task detail / move ---------- */
  const detailScrim = document.getElementById('detailScrim');
  let activeTaskId = null;

  function openDetail(id){
    activeTaskId = id;
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    document.getElementById('detailTitle').textContent = t.title;
    document.getElementById('detailMeta').textContent = t.estimateMin
      ? ('Estimated ' + t.estimateMin + ' min · currently in ' + labelFor(t.column))
      : ('No time estimate · currently in ' + labelFor(t.column));

    const nudge = document.getElementById('doingNudge');
    const alreadyDoing = tasks.find(x=> x.column==='doing' && x.id !== id);
    if(t.column !== 'doing' && alreadyDoing){
      nudge.innerHTML = 'One thing at a time? <b>"'+escapeHtml(alreadyDoing.title)+'"</b> is already in Doing. That\'s okay — you can still move this one too.';
      nudge.classList.add('show');
    } else {
      nudge.classList.remove('show');
    }

    const actions = document.getElementById('moveActions');
    actions.innerHTML = '';
    const order = ['todo','doing','done'];
    order.forEach(col=>{
      if(col === t.column) return;
      const b = document.createElement('button');
      b.className = 'btn ' + (col==='doing' ? 'btn-primary' : 'btn-ghost');
      b.textContent = 'Move to ' + labelFor(col);
      b.addEventListener('click', ()=> moveTask(t.id, col));
      actions.appendChild(b);
    });

    detailScrim.classList.add('show');
  }

  function labelFor(col){ return col==='todo' ? 'To start' : col==='doing' ? 'Doing' : 'Done'; }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  function moveTask(id, col){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    t.column = col;
    t.startedAt = (col === 'doing') ? new Date().toISOString() : null;
    detailScrim.classList.remove('show');
    render();
    toast('Moved to ' + labelFor(col));
  }

  document.getElementById('deleteTask').addEventListener('click', ()=>{
    tasks = tasks.filter(t=> t.id !== activeTaskId);
    detailScrim.classList.remove('show');
    render();
    toast('Task deleted');
  });

  document.getElementById('startFocusFromDetail').addEventListener('click', ()=>{
    selectedTaskId = activeTaskId;
    detailScrim.classList.remove('show');
    document.querySelector('.tab-btn[data-view="focus"]').click();
    updateFocusTaskLabel();
  });

  detailScrim.addEventListener('click', (e)=>{ if(e.target === detailScrim) detailScrim.classList.remove('show'); });

  /* ---------- focus timer ---------- */
  let selectedTaskId = null;
  let durationMin = 25;
  let isBreak = false;
  let remainingSec = durationMin * 60;
  let timerId = null;
  let running = false;

  const RING_CIRC = 2 * Math.PI * 105;
  document.getElementById('ringProgress').setAttribute('stroke-dasharray', RING_CIRC.toFixed(1));

  function updateFocusTaskLabel(){
    const nameEl = document.getElementById('focusTaskName');
    const hintEl = document.getElementById('focusHint');
    if(selectedTaskId){
      const t = tasks.find(x=>x.id===selectedTaskId);
      if(t){
        nameEl.textContent = t.title;
        hintEl.innerHTML = 'Working on this one. <button class="link" id="pickTaskBtn2">Change task</button>';
        document.getElementById('pickTaskBtn2').addEventListener('click', ()=>{
          document.querySelector('.tab-btn[data-view="board"]').click();
        });
        return;
      }
    }
    nameEl.textContent = 'No task selected';
    hintEl.innerHTML = 'Pick something from your board, or just start the timer — <button class="link" id="pickTaskBtn">choose a task</button>';
    document.getElementById('pickTaskBtn').addEventListener('click', ()=>{
      document.querySelector('.tab-btn[data-view="board"]').click();
    });
  }
  updateFocusTaskLabel();

  function fmtTime(sec){
    const m = Math.floor(sec/60).toString().padStart(2,'0');
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return m + ':' + s;
  }

  function renderRing(){
    const total = durationMin * 60;
    const frac = total > 0 ? remainingSec / total : 0;
    const offset = RING_CIRC * (1 - frac);
    const ring = document.getElementById('ringProgress');
    ring.style.strokeDashoffset = offset.toFixed(1);
    ring.classList.toggle('break', isBreak);
    document.getElementById('ringTime').textContent = fmtTime(remainingSec);
    document.getElementById('ringLabel').textContent = isBreak ? 'Break' : 'Focus';
  }
  renderRing();

  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      if(running) return;
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      durationMin = parseInt(chip.dataset.min, 10);
      isBreak = chip.dataset.break === '1';
      remainingSec = durationMin * 60;
      renderRing();
    });
  });

  function tick(){
    remainingSec--;
    if(remainingSec <= 0){
      clearInterval(timerId);
      running = false;
      remainingSec = 0;
      renderRing();
      onSessionComplete();
      return;
    }
    renderRing();
  }

  function onSessionComplete(){
    document.getElementById('startPauseBtn').textContent = 'Start';
    if(!isBreak){
      sessions.push({ date: todayStr() });
      save(SESS_KEY, sessions);
      updateSessionCount();
      toast('Session done. Nicely paced.');
    } else {
      toast('Break\'s over, whenever you\'re ready.');
    }
    if('vibrate' in navigator){ navigator.vibrate([80,60,80]); }
  }

  document.getElementById('startPauseBtn').addEventListener('click', function(){
    if(running){
      running = false;
      clearInterval(timerId);
      this.textContent = 'Start';
    } else {
      running = true;
      this.textContent = 'Pause';
      timerId = setInterval(tick, 1000);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    running = false;
    clearInterval(timerId);
    remainingSec = durationMin * 60;
    document.getElementById('startPauseBtn').textContent = 'Start';
    renderRing();
  });

  function updateSessionCount(){
    const count = sessions.filter(s=> s.date === todayStr()).length;
    document.getElementById('sessionCount').textContent = count;
  }
  updateSessionCount();

  /* ---------- task picker fallback (used if user taps 'choose a task' with none in Doing) ---------- */
  function renderTaskPicker(){
    // if the previously selected focus task got deleted, clear it
    if(selectedTaskId && !tasks.find(t=>t.id===selectedTaskId)){
      selectedTaskId = null;
      updateFocusTaskLabel();
    }
  }

  /* ---------- service worker ---------- */
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  render();
})();
</script>
</body>
</html>
